services:
  - type: web
    name: mealbridge-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: "mealbridge_db"
      - key: JWT_SECRET
        sync: false
